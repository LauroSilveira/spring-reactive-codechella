apiVersion: apps/v1

kind: Deployment
metadata:
  name: postgres
  namespace: codechella-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          env:
            - name: POSTGRES_DB
              value: reactive_codechella_db
            - name: POSTGRES_USER
              value: laurocorreia
            - name: POSTGRES_HOST_AUTH_METHOD
              value: trust
          ports:
            - containerPort: 5432